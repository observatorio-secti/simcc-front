name: CI/CD Pipeline - Simcc Front

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/simcc/simcc-front
            git pull origin main --ff-only
            docker build --build-arg VITE_BASE_PATH=/simcc/ --build-arg VITE_URL_GERAL2=https://observatoriocti.secti.ba.gov.br/oda/v1/ --output type=local,dest=./dist .
